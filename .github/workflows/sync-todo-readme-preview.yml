name: sync-todo-readme-preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev history
        uses: actions/checkout@v4
        with:
          ref: todo-readme-automation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate README preview from dev TODO markers
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev
          python - <<'PY'
          from __future__ import annotations
          import json
          import re
          import subprocess
          from dataclasses import dataclass
          from pathlib import Path

          ROOT = Path('.')
          README = ROOT / 'README.md'
          HEADING = '### 📝 Complete TODO List'
          ENTRY_RE = re.compile(
              r'^- \[ \] \*\*(?P<path>.+?):(?P<line>\d+)\*\* - (?P<msg>.*)$'
          )
          TODO_RE = re.compile(r'#\s*TODO\b(?P<rest>.*)$')

          def git(*args: str) -> str:
              return subprocess.check_output(['git', *args], text=True).strip()

          @dataclass(frozen=True)
          class Entry:
              path: str
              line: int
              msg: str
              raw: str | None = None

          def extract_todos(path: str) -> list[Entry]:
              p = Path(path)
              entries: list[Entry] = []
              text = p.read_text(encoding='utf-8')
              for lineno, raw_line in enumerate(text.splitlines(), 1):
                  m = TODO_RE.search(raw_line)
                  if not m:
                      continue
                  msg = m.group('rest').strip()
                  # Remove the colon directly following TODO. A colon inside
                  # TODO(owner): is part of the preserved owner metadata.
                  if msg.startswith(':'):
                      msg = msg[1:].lstrip()
                  msg = msg.strip()
                  entries.append(Entry(path=path, line=lineno, msg=msg))
              return entries

          # Explicitly search every Python file in the repository. The update
          # below is nevertheless scoped to Python files changed main->dev.
          all_py = sorted(
              p.as_posix() for p in ROOT.rglob('*.py')
              if '.git' not in p.parts
          )
          all_todos = {p: extract_todos(p) for p in all_py}
          total_todos = sum(len(v) for v in all_todos.values())

          changed_raw = git(
              'diff', '--name-only', 'origin/main', 'origin/dev', '--', '*.py'
          )
          changed_py = sorted({line.strip() for line in changed_raw.splitlines() if line.strip()})
          changed_set = set(changed_py)
          changed_todos = {p: all_todos.get(p, extract_todos(p)) for p in changed_py}

          raw_readme = README.read_text(encoding='utf-8')
          final_newline = raw_readme.endswith('\n')
          lines = raw_readme.splitlines()
          heading_indices = [i for i, line in enumerate(lines) if line.strip() == HEADING]
          if len(heading_indices) != 1:
              raise SystemExit(f'Expected exactly one unchanged heading, found {len(heading_indices)}')
          heading_idx = heading_indices[0]
          end_idx = next(
              (i for i in range(heading_idx + 1, len(lines)) if lines[i].startswith('## ')),
              len(lines),
          )

          old_entries: list[Entry] = []
          for idx in range(heading_idx + 1, end_idx):
              line = lines[idx]
              if not line.strip():
                  continue
              m = ENTRY_RE.match(line)
              if not m:
                  raise SystemExit(f'Unparsed README TODO line {idx + 1}: {line!r}')
              old_entries.append(Entry(
                  path=m.group('path'),
                  line=int(m.group('line')),
                  msg=m.group('msg'),
                  raw=line,
              ))

          retained = [e for e in old_entries if e.path not in changed_set]
          generated: list[Entry] = []
          for path in changed_py:
              generated.extend(changed_todos[path])

          final_entries = retained + generated
          final_entries.sort(key=lambda e: (e.path, e.line, e.msg))
          rendered = [
              f'- [ ] **{e.path}:{e.line}** - {e.msg}'
              for e in final_entries
          ]

          new_lines = lines[:heading_idx + 1] + [''] + rendered + [''] + lines[end_idx:]
          new_text = '\n'.join(new_lines) + ('\n' if final_newline else '')
          README.write_text(new_text, encoding='utf-8')

          old_keys = {(e.path, e.line, e.msg) for e in old_entries}
          new_keys = {(e.path, e.line, e.msg) for e in final_entries}
          summary = {
              'all_python_file_count': len(all_py),
              'all_todo_count': total_todos,
              'readme_entry_count_before': len(old_entries),
              'readme_entry_count_after': len(final_entries),
              'changed_python_files_main_to_dev': changed_py,
              'changed_file_todos': {k: [vars(e) for e in v] for k, v in changed_todos.items()},
              'added_keys': sorted(new_keys - old_keys),
              'removed_keys': sorted(old_keys - new_keys),
          }
          Path('/tmp/todo-sync-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Show README diff and summary
        shell: bash
        run: |
          set -euo pipefail
          echo '### TODO sync summary' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/todo-sync-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          git diff -- README.md >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff --stat -- README.md
          git --no-pager diff -- README.md | sed -n '1,260p'

      - name: Push generated README to preview branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- README.md; then
            echo 'No README changes generated.'
            exit 0
          fi
          git checkout -B todo-readme-preview
          git add README.md
          git commit -m "docs: update dev TODO list from Python markers"
          git push --force origin HEAD:todo-readme-preview
