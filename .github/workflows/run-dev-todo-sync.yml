name: run-dev-todo-sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute dev sync generator
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev
          python - <<'OUTER'
          import re
          import textwrap
          from pathlib import Path
          raw = Path('.github/workflows/sync-todo-readme-preview.yml').read_text(encoding='utf-8')
          start = raw.index("python - <<'PY'") + len("python - <<'PY'")
          match = re.search(r"\n\s*PY\n", raw[start:])
          if not match:
              raise SystemExit('Embedded Python block terminator not found')
          code = textwrap.dedent(raw[start:start + match.start()])
          exec(compile(code, 'embedded-sync.py', 'exec'), {'__name__': '__main__'})
          OUTER
      - name: Show generated diff
        shell: bash
        run: |
          git --no-pager diff --stat -- README.md
          git --no-pager diff -- README.md | sed -n '1,320p'
      - name: Push preview branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- README.md; then
            echo 'No README changes generated.'
            exit 0
          fi
          git checkout -B todo-readme-preview
          git add README.md
          git commit -m "docs: update dev TODO list from Python markers"
          git push --force origin HEAD:todo-readme-preview
